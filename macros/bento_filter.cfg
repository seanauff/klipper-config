## in the end print gcode macro, add "UPDATE_DELAYED_GCODE ID=bento_off_delay DURATION=180"
## this keeps your filter running for 180s after the print finishes to clean the chamber a bit more.

## in the start print macro, add "UPDATE_DELAYED_GCODE ID=bento_off_delay DURATION=0"
## this cancels the pending delayed gcode from executing.

[delayed_gcode bento_off_delay]
gcode:
    SET_FAN_SPEED FAN=Bento_filter SPEED=0
