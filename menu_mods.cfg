######################################
## LCD Menu mods #####################
######################################

# disable octoprint LCD menu
[menu __main __octoprint]
type: disabled

# Preheat menu overrides
[menu __main __temp __cooldown_mod]
type: command
enable: {(printer['extruder'].target>0) or (printer['heater_bed'].target>0)}
index: 1
name: Cooldown
gcode:
    COOLDOWN

[menu __main __temp __preheat_abs_mod]
type: command
index: 2
name: Preheat ABS
gcode:
    PREHEAT_ABS

[menu __main __temp __preheat_nylon]
type: command
index: 3
name: Preheat Nylon
gcode:
    PREHEAT_NYLON

[menu __main __temp __preheat_pc]
type: command
index: 4
name: Preheat PC
gcode:
    PREHEAT_PC

[menu __main __temp __preheat_tpu]
type: command
index: 5
name: Preheat TPU
gcode:
    PREHEAT_TPU

[menu __main __temp __preheat_petg]
type: command
index: 6
name: Preheat PETG
gcode:
    PREHEAT_PETG

[menu __main __temp __preheat_pla_mod]
type: command
index: 7
name: Preheat PLA
gcode:
    PREHEAT_PLA

[menu __main __temp __cooldown]
type: disabled

[menu __main __temp __preheat_abs]
type: disabled

[menu __main __temp __preheat_pla]
type: disabled
