# Voron Design VORON Trident 300mm Spider v2.2 TMC2209 UART config

# See README for common procedures.

# See docs/Config_Reference.md for a description of parameters.
# https://www.klipper3d.org/Config_Reference.html

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_2A0058001051383039343538-if00

[mcu sb_can_th]
canbus_uuid: 687b4717f3e9

[mcu ucan]
canbus_uuid: a13f7fb295f5

[mcu cartographer]
canbus_uuid: 4a005f441e99

[mcu hotkey]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6612C771F7D852B-if00
restart_method: command

#####################################################################
#	Cartographer Probe
#####################################################################

[cartographer]
mcu: cartographer
x_offset: 0
y_offset: 25
verbose: yes

[cartographer scan]
probe_speed: 5 # default
mesh_runs: 2
mesh_direction: x # default
mesh_height: 3 # default
mesh_path: snake # default

[cartographer touch]
samples: 5 # default
max_samples: 10 
UNSAFE_max_touch_temperature: 220 # allow to be hotter (default 150)

[cartographer coil]
name: cartographer_coil # default
min_temp: 0
max_temp: 105

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 5000
max_z_velocity: 50
max_z_accel: 350
square_corner_velocity: 5.0

[skew_correction]

[include resonance_tester.cfg]

[input_shaper]
shaper_freq_x: 64.8
shaper_type_x: zv
shaper_freq_y: 41.2
shaper_type_y: mzv

# Enable object exclusion
[exclude_object]

# Enable arcs support
[gcode_arcs]
resolution: 0.1

[force_move]
enable_force_move: True
#   Set to true to enable FORCE_MOVE and SET_KINEMATIC_POSITION
#   extended G-Code commands. The default is false.

# Enable Pause/Resume
[pause_resume]

[virtual_sdcard]
path: ~/printer_data/gcodes

# Enable the "M118" and "RESPOND" extended commands.
[respond]
default_prefix: 

#####################################################################
#      X/Y (B/A) Stepper Settings
#####################################################################

[stepper_x]
# CoreXY B Motor - Connected to Spider Board M1 (X-MOT)
step_pin: PE11
dir_pin: PE10
enable_pin: !PE9
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: ^PA1
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 100   # Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PE7
interpolate: False
run_current: 1.0
sense_resistor: 0.110

[stepper_y]
# CoreXY A Motor - Connected to Spider Board M2 (Y-MOT)
step_pin: PD8
dir_pin: PB12
enable_pin: !PD9
rotation_distance: 40
microsteps: 16
full_steps_per_rotation:200
endstop_pin: ^PA2
position_min: 0
position_endstop: 308
position_max: 308
homing_speed: 100  # Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PE15
interpolate: False
run_current: 1.0
sense_resistor: 0.110

#####################################################################
#      Z Stepper Settings - All 3 are 42HC40-204A-300N84
#####################################################################

# Z Left Motor (Z0 Stepper) - Connected to Spider Board M7 (E3-MOT)
[stepper_z]
step_pin: PD12
dir_pin: !PC4
enable_pin: !PE8
rotation_distance: 4
full_steps_per_rotation: 200
microsteps: 16
endstop_pin: probe:z_virtual_endstop # uses cartographer as virtual endstop
#position_endstop: 1.4
position_max: 250
position_min: -10
homing_speed: 10
second_homing_speed: 3
homing_retract_dist: 0 # cartographer needs this to be set to 0

[tmc2209 stepper_z]
uart_pin: PA15
uart_address: 0
interpolate: False
run_current: 1.0
sense_resistor: 0.110

# Z Rear Motor (Z1 Stepper) - Connected to Spider Board M6 (E2-MOT)
[stepper_z1]
step_pin: PE2
dir_pin: !PE4
enable_pin: !PE3
rotation_distance: 4
full_steps_per_rotation: 200
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PC14
interpolate: False
run_current: 1.0
sense_resistor: 0.110

# Z Right Motor (Z2 Stepper) - Conencted to Spider Board M5 (E1-MOT)
[stepper_z2]
step_pin: PE6
dir_pin: !PC13
enable_pin: !PE5
rotation_distance: 4
full_steps_per_rotation: 200
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PC15
interpolate: False
run_current: 1.0
sense_resistor: 0.110

#####################################################################
#   Extruder Stepper Settings
#####################################################################

# Extruder Motor - Connected via SB CAN TH
[extruder]
step_pin: sb_can_th:PA7
dir_pin: !sb_can_th:PA5
enable_pin: !sb_can_th:PB4
rotation_distance: 22.7215
gear_ratio: 50:10 # Stealthburner
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: sb_can_th:PA8
sensor_type: Generic 3950
sensor_pin: sb_can_th:PA0
min_temp: 0
max_temp: 300
max_power: 1.0
min_extrude_temp: 170
control: pid
# tuned 2023-11-20 for 245 C setpoiint
pid_kp: 20.313
pid_ki: 1.066
pid_kd: 96.743
pressure_advance: 0.05
pressure_advance_smooth_time: 0.040
max_extrude_only_distance: 500.0
#max_extrude_cross_section: 5 # use default

[tmc2209 extruder]
uart_pin: sb_can_th:PA10
tx_pin: sb_can_th:PA9
interpolate: false
run_current: 0.5
sense_resistor: 0.110
# diag_pin: sb_can_th:PB5

#####################################################################
#   Heated Bed
#####################################################################

[heater_bed]
heater_pin: PB4 # Spider Board BED OUT
sensor_type: Generic 3950
sensor_pin: PB0 # TB
max_power: 0.62 # Adjust max power so the heater doesn't warp the bed (target 0.4 W/cm^2)
min_temp: 0
max_temp: 125
control: pid
# tuned 2023-09-30 for 100 C setpoint
pid_kp: 58.437
pid_ki: 1.246
pid_kd: 277.475
pwm_cycle_time: 0.3 # ~3.33 Hz (minimum allowed)

#####################################################################
#   Chamber Heater
#####################################################################

[heater_generic chamber_heater]
gcode_id: C
heater_pin: PB15 # E0 Out on Spider Board
max_power: 0.75 # tweak to moderate temperature from heater
sensor_type: temperature_combined
sensor_list: temperature_sensor chamber_temp
combination_method: max
maximum_deviation: 999.9
control: pid # calibrated 2025-11-26 @ 50 C
pid_kp: 53.129
pid_ki: 0.165
pid_kd: 400
min_temp: 0
max_temp: 70
pwm_cycle_time: 0.3 # ~3.33 Hz (minimum allowed)

[verify_heater chamber_heater]   #setup chamber heater verification parameters
max_error: 120
check_gain_time: 240
hysteresis: 10
heating_gain: 1 

#####################################################################
#	Fan Control
#####################################################################

# Hotend Fan - Connected to SB CAN TH FAN0
# Three wire fan - 24V - Orion OD4010-24HB01A
[heater_fan hotend_fan]
pin: sb_can_th:PA2
max_power: 1.0 # 24V fan running on the 24V supply (fan max 26.4 V)
shutdown_speed: 1.0 # has to be 0.0 if max_power less than 1.0
heater: extruder
heater_temp: 50.0
hardware_pwm: False
tachometer_pin: ^sb_can_th:PB11
tachometer_ppr: 2
tachometer_poll_interval: 0.0015

# Part Cooling Fan - Connected to SB CAN TH FAN1
# Three wire fan - 24V - Delta BFB0524HH-F00
[fan]
pin: sb_can_th:PA3
max_power: 1.0 # 24V fan running on the 24V supply (fan max 27.6 V)
shutdown_speed: 0.0 # has to be 0.0 when max_power less than 1.0
kick_start_time: 0.25
off_below: 0.05
hardware_pwm: False
tachometer_pin: ^sb_can_th:PB6
tachometer_ppr: 2
tachometer_poll_interval: 0.0015

# Main enclosure fans (2x 60 mm) that run to keep the electronics cool
[temperature_fan electronics_fan]
pin: PC8 # E1 Out
max_power: 0.9
shutdown_speed: 0.0
kick_start_time: 0.5
off_below: 0.21
min_speed: 0.2
sensor_type: temperature_combined
sensor_list: temperature_sensor Spider_MCU, temperature_sensor Raspberry_Pi, temperature_sensor driver_A, temperature_sensor UCAN_MCU
combination_method: max
maximum_deviation: 999.9
control: pid # this tuning seems to work fine
pid_Kp: 5
pid_Ki: 0.1
pid_Kd: 0
min_temp: 0.0
max_temp: 90.0
target_temp: 65.0

# Small fan (1x 40 mm) that runs to keep the RPi (and UCAN board) cool
[temperature_fan RPi_fan]
pin: PB2 # Fan2
max_power: 0.9
shutdown_speed: 0.0
kick_start_time: 0.5
off_below: 0.21
min_speed: 0.2
sensor_type: temperature_combined
sensor_list: temperature_sensor Raspberry_Pi, temperature_sensor UCAN_MCU
combination_method: max
maximum_deviation: 999.9
control: pid # this tuning seems to work fine
pid_Kp: 5
pid_Ki: 0.1
pid_Kd: 0
min_temp: 0.0
max_temp: 90.0
target_temp: 60.0

# Exhaust fan for chamber
[temperature_fan chamber_exhaust]
pin: PB3 # E1 Out
max_power: 0.9
shutdown_speed: 0.0
kick_start_time: 0.5
off_below: 0.21
min_speed: 0.2
sensor_type: temperature_combined
sensor_list: temperature_sensor chamber_temp
combination_method: max
maximum_deviation: 999.9
control: watermark
max_delta: 2.0 # default
min_temp: 0.0
max_temp: 90.0
target_temp: 35.0

[fan_generic Bento_filter]
pin: PA14 # Fan1
max_power: 0.9
shutdown_speed: 0.0
kick_start_time: 0.5
off_below: 0.21

# 60mm 12V fan that pushes air through the PTC chamber heater
[controller_fan chamber_heater_fan]
pin: PA13 # Fan0 on Spider Board, voltage selector set to 12V
max_power: 1.0
shutdown_speed: 1.0 # max fan speed in case of error
#cycle_time:
#hardware_pwm:
#kick_start_time:
#off_below:
fan_speed: 1.0
idle_timeout: 60 # seconds to run after heater shuts off
idle_speed: 1.0 # keep fan on at full speed when idle to keep chamber air mixed
heater: chamber_heater

# Thermistor attached to driver A heatsink
[temperature_sensor driver_A]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC3 # TE3
min_temp: 0
max_temp: 100

# Thermistor in chamber (upper rear)
[temperature_sensor chamber_temp]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC1 # TE1
min_temp: 0
max_temp: 100

# Thermistor in ambient (near intake fans)
[temperature_sensor ambient_temp]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PB1
min_temp: 0
max_temp: 40

[temperature_sensor Spider_MCU]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor Toolhead_MCU]
sensor_type: temperature_mcu
sensor_mcu: sb_can_th
min_temp: 0
max_temp: 100

[temperature_sensor UCAN_MCU]
sensor_type: temperature_mcu
sensor_mcu: ucan
min_temp: 0
max_temp: 100

[temperature_sensor Hotkey_MCU]
sensor_type: temperature_mcu
sensor_mcu: hotkey
min_temp: 0
max_temp: 100

[temperature_sensor Cartographer_MCU]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 0
max_temp: 100

[temperature_sensor Raspberry_Pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

#####################################################################
#	Smart Filament Sensor
#####################################################################

# BTT SFS 2.0 - Connected to Spider Board Endstop pins:
# X-: Switch sensor
# Y-: Motion sensor

[filament_switch_sensor filament_switch]
switch_pin: ^PB14
pause_on_runout: True
insert_gcode:
    M117 Insert Detected
runout_gcode:
    M117 Runout Detected

[filament_motion_sensor filament_motion]
detection_length: 14
extruder: extruder
switch_pin: ^PB13
pause_on_runout: True
insert_gcode:
    M117 Insert Detected
runout_gcode:
    M117 Runout Detected

#####################################################################
#	Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 3600
gcode:
	M106 S0 # Turn off fan
	COOLDOWN
	M84 # disable steppers
    M117 # clear display
    STATUS_READY # set LEDs

[safe_z_home]
home_xy_position:150,150
speed:100
z_hop:10
   
[z_tilt]
z_positions:
	-48,20
	153,348
	355,20
points:
	30,5
	150,245
	270,5
speed: 300
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.01

[bed_mesh]
speed: 300
horizontal_move_z: 3
mesh_min: 10,35
mesh_max: 290,290
zero_reference_position: 150,150
probe_count: 30,30
algorithm: bicubic
adaptive_margin: 10
mesh_pps: 0,0 # Disable interpolation - mesh is probably dense enough

#####################################################################
#	Displays
#####################################################################

[display] #	mini12864 LCD Display
lcd_type: uc1701
cs_pin: PC11
a0_pin: PD2
rst_pin: PC10
encoder_pins: ^PC6,^PC7
click_pin: ^!PA8
contrast: 63
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5

[pwm_cycle_time beeper]
pin: PC9
#pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.0005 # Default beeper tone in kHz. 1 / 0.0005 = 2000Hz (2kHz)

[include lcd_tweaks.cfg] # Voron LCD tweaks

[include menu_mods.cfg] # LCD menu mods

[include hotkey.cfg] # FYSETC hotkeys

#####################################################################
#	LEDs
#####################################################################

[include leds.cfg]

#####################################################################
#	Macros
#####################################################################

[include macros/*.cfg]

#####################################################################
#	Print Status Notifications
#####################################################################

[gcode_shell_command print_started]
command: wget -q -O /dev/null https://node-red.auffinger.dev/3dprinter/trident/print_started
timeout: 2.
verbose: False

[gcode_shell_command print_done]
command: wget -q -O /dev/null https://node-red.auffinger.dev/3dprinter/trident/print_done
timeout: 2.
verbose: False

[gcode_shell_command print_paused]
command: wget -q -O /dev/null https://node-red.auffinger.dev/3dprinter/trident/print_paused
timeout: 2.
verbose: False

[include moonraker_obico_macros.cfg]

